name: check generated files

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check-generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          run_install: true

      - name: generate contentful-content-model
        run: pnpm run generate-contentful-content-model

      - name: generate contentful-content-model-types
        run: pnpm run generate-contentful-content-model-types

      - name: git diff
        run: |
          git diff --exit-code
